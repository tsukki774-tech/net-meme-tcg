<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ネットミームTCG - 世代間レスバ大戦</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📱 ネットミームTCG：世代間レスバ大戦</h1>

<!-- デッキ選択画面 -->
<div id="deck-select-screen" class="select-screen">
  <h2>使用する世代デッキを選択してください</h2>
  <div class="deck-options">
    <button class="deck-btn" onclick="startGame('2ch')">
      <strong>① 2ch・Flash黎明期</strong><br>
      <small>低コストAA展開＆高耐久</small>
    </button>
    <button class="deck-btn" onclick="startGame('niconico')">
      <strong>② ニコニコ・MAD全盛期</strong><br>
      <small>弾幕バフ＆コンボ火力</small>
    </button>
    <button class="deck-btn" onclick="startGame('reiwa')">
      <strong>③ 令和・SNSバズ世代</strong><br>
      <small>超速攻＆構文カウンター</small>
    </button>
  </div>
</div>

<!-- メインゲーム画面 -->
<div id="game-screen" class="game-container" style="display: none;">
  <!-- CPU ステータス -->
  <div class="status-bar cpu-bar">
    <div><strong id="cpu-title">👾 CPU</strong> <span id="cpu-deck-count" class="deck-count"></span></div>
    <div class="stat-box">
      メンタル: <span id="cpu-hp" class="hp">20</span> | ギガ: <span id="cpu-giga" class="giga">1/1</span>
    </div>
  </div>

  <!-- CPU フィールド -->
  <div id="cpu-field" class="field-area">
    <span class="empty-msg">相手の場にミームはいません</span>
  </div>

  <!-- 操作ガイド（ナビゲーションバー） -->
  <div id="guide-banner" class="guide-banner">
    ターン 1：手札のカードをタップして投稿しよう！
  </div>

  <!-- プレイヤー フィールド -->
  <div id="player-field" class="field-area">
    <span class="empty-msg">自分の場にミームはいません</span>
  </div>

  <!-- プレイヤー ステータス -->
  <div class="status-bar player-bar">
    <div><strong id="player-title">🧑 あなた</strong> <span id="player-deck-count" class="deck-count"></span></div>
    <div class="stat-box">
      メンタル: <span id="player-hp" class="hp">20</span> | ギガ: <span id="player-giga" class="giga">1/1</span>
    </div>
  </div>

  <!-- 操作ボタン＆最新ログ -->
  <div class="controls">
    <div id="log" class="log-box"></div>
    <div class="btn-group">
      <button id="direct-attack-btn" onclick="directAttack()" class="btn-danger" disabled>💥 相手本体に直接攻撃</button>
      <button id="end-turn-btn" onclick="endTurn()">⏭️ ターン終了</button>
    </div>
  </div>

  <!-- 手札 -->
  <div class="field-label">▼ あなたの手札（緑枠のカードをタップして使用）</div>
  <div id="player-hand" class="hand-area"></div>
</div>

<!-- ターン切り替わり・CPU行動のカットイン表示 -->
<div id="cutin-overlay" class="cutin-overlay" style="display: none;">
  <div id="cutin-text" class="cutin-text"></div>
</div>

<script src="cards.js"></script>
<script src="game.js"></script>
</body>
</html>
